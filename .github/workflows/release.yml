name: Release

# Tags are prefixed with the plugin id because they are repository-wide:
#
#     git tag reverse-proxy-v1.1.0 && git push origin reverse-proxy-v1.1.0
#
# Note that GitHub's "Latest release" badge is also repository-wide, so it flips
# between unrelated plugins and must not be relied on. Nothing here does: the
# update feed points at explicit, versioned asset URLs.

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Full history so the update.json commit can be pushed to main.
          fetch-depth: 0

      - name: Parse the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Split on the LAST "-v" so plugin ids may contain hyphens.
          PLUGIN_ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"

          if [ -z "$PLUGIN_ID" ] || [ -z "$VERSION" ] || [ "$PLUGIN_ID" = "$TAG" ]; then
            echo "::error::Tag '$TAG' is not of the form <plugin-id>-v<version>."
            exit 1
          fi

          if [ ! -f "$PLUGIN_ID/plugin.json" ]; then
            echo "::error::Tag '$TAG' names plugin '$PLUGIN_ID', which has no plugin.json."
            exit 1
          fi

          echo "id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $PLUGIN_ID $VERSION"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: bcmath, intl, zip
          tools: composer:v2
          coverage: none

      - name: Check the manifest matches the tag
        run: |
          MANIFEST_VERSION=$(php -r 'echo json_decode(file_get_contents($argv[1]), true)["version"] ?? "";' "${{ steps.tag.outputs.id }}/plugin.json")

          if [ "$MANIFEST_VERSION" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::plugin.json says $MANIFEST_VERSION but the tag says ${{ steps.tag.outputs.version }}. Bump the manifest before tagging."
            exit 1
          fi

      - name: Build the archive
        env:
          # Stamps url and update_url into the manifest inside the archive.
          PLUGINS_REPOSITORY: ${{ github.repository }}
        run: php scripts/build-plugin.php "${{ steps.tag.outputs.id }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${ID}-${VERSION}.zip" \
            --title "${ID} ${VERSION}" \
            --notes "Install by importing the attached zip under **Admin → Plugins → Import**, or unzip it into your panel's \`plugins/\` directory and run \`php artisan p:plugin:install ${ID}\`."

      - name: Record the release in the update feed
        env:
          ID: ${{ steps.tag.outputs.id }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # A tag push checks out a detached HEAD, so main has to be established
          # explicitly rather than relying on checkout's DWIM.
          git fetch origin main
          git checkout -B main origin/main

          php scripts/update-manifest.php "$ID" "$VERSION" "${{ github.repository }}"

          if git diff --quiet update.json; then
            echo "update.json already current, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Record ${ID} ${VERSION} in the update feed"
          git push origin main
